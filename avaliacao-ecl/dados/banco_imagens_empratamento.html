<!doctype html>
<html lang="pt-PT"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Banco de Imagens Empratamento</title>
<style>
:root{--bg:#f6f4ef;--card:#fff;--ink:#1f2420;--muted:#6b716b;--line:#e3e0d8;--acc:#3f6b45;--acc2:#e8efe6;--sel:#c9a227}
@media (prefers-color-scheme:dark){:root{--bg:#161917;--card:#202421;--ink:#ecefeb;--muted:#9aa29b;--line:#323832;--acc:#8fc196;--acc2:#26302a;--sel:#e0bf4f}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:14px 16px 10px}
h1{margin:0 0 2px;font-size:20px}.sub{color:var(--muted);font-size:13px;margin-bottom:10px}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:6px}
input[type=search]{flex:1;min-width:180px;padding:8px 12px;border:1px solid var(--line);border-radius:999px;background:var(--card);color:var(--ink);font-size:15px}
button.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:5px 11px;font-size:13px;cursor:pointer}
button.chip.on{background:var(--acc);border-color:var(--acc);color:var(--bg)}
.count{color:var(--muted);font-size:13px;margin-left:auto}
main{padding:16px;display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px}
.c{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;position:relative}
.c.picked{outline:3px solid var(--sel)}
.c img{width:100%;aspect-ratio:1;object-fit:contain;background:#fff;cursor:zoom-in;display:block}
.c .b{padding:8px 10px 10px;display:flex;flex-direction:column;gap:3px;flex:1}
.n{font-size:13px;font-weight:600}.meta{font-size:12px;color:var(--muted)}.pr{font-size:13px;margin-top:auto}
.c a{font-size:12px;color:var(--acc)}
.star{position:absolute;top:6px;right:6px;width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--muted);font-size:17px;cursor:pointer;line-height:1}
.picked .star{background:var(--sel);color:#fff;border-color:var(--sel)}
#lb{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;align-items:center;justify-content:center;flex-direction:column;gap:10px;z-index:9;padding:16px}
#lb img{max-width:min(90vw,800px);max-height:80vh;background:#fff;border-radius:8px}#lb div{color:#fff;text-align:center}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:40px}
</style></head><body>

let G='Tudo',S='Tudo',onlySel=false;let sel=new Set();try{sel=new Set(JSON.parse(localStorage.getItem('selEmpr')||'[]'))}catch(e){}
const save=()=>{try{localStorage.setItem('selEmpr',JSON.stringify([...sel]))}catch(e){}};
const img=(u,w)=>u+'?w='+w+'&h='+w+'&format=jpg&quality=80&dpi=72';
const el=(t,a={},h='')=>{const e=document.createElement(t);Object.assign(e,a);if(h)e.innerHTML=h;return e};
function chips(){const g=document.getElementById('grp');g.innerHTML='';['Tudo',...new Set(D.map(d=>d.g))].forEach(x=>{const b=el('button',{className:'chip'+(G===x&&!onlySel?' on':''),textContent:x});b.onclick=()=>{G=x;S='Tudo';onlySel=false;chips();draw()};g.appendChild(b)});
const sb=el('button',{className:'chip'+(onlySel?' on':''),textContent:'★ A minha seleção ('+sel.size+')'});sb.onclick=()=>{onlySel=!onlySel;chips();draw()};g.appendChild(sb);
const s=document.getElementById('subs');s.innerHTML='';if(G!=='Tudo'&&!onlySel){['Tudo',...new Set(D.filter(d=>d.g===G).map(d=>d.s))].forEach(x=>{const b=el('button',{className:'chip'+(S===x?' on':''),textContent:x});b.onclick=()=>{S=x;chips();draw()};s.appendChild(b)})}
const c=el('span',{className:'count',id:'cnt'});g.appendChild(c)}
function draw(){const q=document.getElementById('q').value.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');const grid=document.getElementById('grid');grid.innerHTML='';
const L=D.filter(d=>(onlySel?sel.has(d.u):(G==='Tudo'||d.g===G)&&(S==='Tudo'||d.s===S))&&(!q||(d.n+' '+d.m+' '+d.s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').includes(q)));
document.getElementById('cnt').textContent=L.length+' produtos';
if(!L.length)grid.appendChild(el('div',{className:'empty',textContent:'Nenhum produto encontrado.'}));
L.forEach(d=>{const c=el('div',{className:'c'+(sel.has(d.u)?' picked':'')});const im=el('img',{src:img(d.i,400),alt:d.n,loading:'lazy'});im.onclick=()=>{document.getElementById('lbi').src=img(d.i,1000);document.getElementById('lbt').textContent=d.n;document.getElementById('lb').style.display='flex'};c.appendChild(im);
const st=el('button',{className:'star',textContent:sel.has(d.u)?'★':'☆',title:'Guardar na seleção'});st.onclick=()=>{sel.has(d.u)?sel.delete(d.u):sel.add(d.u);save();chips();draw()};c.appendChild(st);
const b=el('div',{className:'b'});b.appendChild(el('div',{className:'n',textContent:d.n}));b.appendChild(el('div',{className:'meta',textContent:[d.s,d.e].filter(Boolean).join(' · ')}));if(d.p)b.appendChild(el('div',{className:'pr',textContent:d.p+' € c/ IVA'+(d.k?' / kg':'')}));const a=el('a',{href:d.u,target:'_blank',rel:'noopener',textContent:'Ver na Makro ↗'});b.appendChild(a);c.appendChild(b);grid.appendChild(c)})}
document.getElementById('q').oninput=draw;document.getElementById('lb').onclick=()=>{document.getElementById('lb').style.display='none'};
chips();draw();
